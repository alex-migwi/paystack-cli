name: Sync Enriched Paystack Spec

on:
  repository_dispatch:
    types: [enriched-spec-updated]
  workflow_dispatch:
    inputs:
      spec_url:
        description: 'Custom URL to paystack-enriched.json'
        type: string
        required: false

jobs:
  sync-enriched-spec:
    runs-on: ubuntu-latest

    # grant only the minimum permissions needed to open a PR
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout paystack-cli repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Download & Update Local Enriched Spec Copy
        if: ${{ github.event_name == 'repository_dispatch' || github.event.inputs.spec_url }}
        env:
          SPEC_SHA: "${{ github.event.client_payload.sha }}"
          ENRICHED_SPEC_URL: "${{ github.event.client_payload.sha && 'https://raw.githubusercontent.com/alex-migwi/paystack-spec-enriched/${SPEC_SHA}/dist/paystack-enriched.json' || github.event.inputs.spec_url }}"
        run: |
          mkdir -p spec
          echo "🌐 GitHub Action fetching spec from remote release: $ENRICHED_SPEC_URL"
          curl -sSL "$ENRICHED_SPEC_URL" -o lib/paystack/openapi.json
          echo "✅ Local spec copy updated: lib/paystack/openapi.json"

      - name: Validate CLI & Run Test Suite
        run: |
          node --check cli.js
          node cli.js openapi info

      - name: Create Isolated Spec Update PR via GitHub Bot
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated update to enriched spec file"
          title: "Automated Spec Update"
          body: "This PR was securely opened by the GitHub Action Bot. It strictly contains updates to enriched sec file."
          branch: "automation/enriched-spec-update"
          base: main
          reviewers: "alex-migwi"
          
          # This discard ANY changes made outside of this explicit path.
          add-paths: |
            lib/paystack/openapi.json
          
